server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Jika kamu punya API lewat reverse proxy (hapus kalau nggak pakai)
    # location /api/ {
    #     proxy_pass http://backend:5000;
    # }
}
